# Publish a release into the Git-hosted NuGet feed at AceMQ-Company/nuget, served
# over GitHub Pages at https://acemq.org/nuget/.
#
# Triggered by a tag:  git tag v0.1.0 && git push origin v0.1.0
#
# There is no push endpoint: the feed is a static directory tree, so publishing is
# a commit to another repository. The built-in GITHUB_TOKEN is scoped to this
# repository and cannot write there, so each target gets its own **deploy key**:
#
#   NUGET_REPO_DEPLOY_KEY    -> AceMQ-Company/nuget
#   LANDING_PAGE_DEPLOY_KEY  -> AceMQ-Company/AceMQ-Company.github.io
#
# A deploy key can write to exactly one repository and nothing else, which a
# personal access token cannot express. It belongs to the repository rather than to
# a person, so it survives them leaving and cannot be used as them, and it does not
# expire, so a release cannot fail at three in the morning because a token aged out.
#
# Rotating one: generate a key pair, replace the deploy key on the target
# repository, then update the secret here. Both are listed under the target
# repository's Settings -> Deploy keys.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true

# Least privilege for every job that does not ask for more. A job needing more
# declares it itself, so the privileges are reviewable in the file rather than
# inherited from an organisation setting somebody can change later.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      published: ${{ steps.push.outputs.published }}

    # A release runs the integration suite. It is the one moment where waiting for
    # the slow tests is obviously worth it: this is the artifact people depend on.
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        # The fixed --name is what ACEMQ_TEST_RABBITMQCTL addresses below, and it
        # matches ci.yml. Without it the blocked-connection test cannot reach the
        # broker's CLI, and that test fails rather than skipping — deliberately,
        # since a skip is how the whole class of blocked-broker defects stayed
        # invisible. The release ran without it once and failed here.
        options: >-
          --name acemq-ci-rabbit
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Work out the version
        id: version
        env:
          # Through the environment rather than interpolated into the script. A tag
          # name and a dispatch input are both caller-controlled text, and inlining
          # either one lets whoever writes it run shell here.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${TAG_NAME#v}"
          fi
          # An allow-list, not a deny-list. The version reaches a file path, a
          # commit message and a package id, so anything that is not plainly a
          # version number is refused rather than escaped.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::not a release version: '$VERSION'"
            exit 1
          fi
          # The line stays on 0.7.x until that is deliberately changed. Without
          # this, a mistyped tag ships an 0.8.0 or a 1.0.0 that cannot be recalled --
          # a published version is permanent even on a feed we control, because
          # somebody's lockfile already has it. Lift this when the line moves on.
          case "$VERSION" in
            0.7.*) ;;
            *)
              echo "::error::this library releases 0.7.x only; '$VERSION' needs the guard in release.yml lifted first"
              exit 1
              ;;
          esac
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build --configuration Release "-p:Version=$VERSION"

      - name: Test
        run: >
          dotnet test tests/AceMq.Amqp.Tests/AceMq.Amqp.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the codecs
        # Each of these ships as its own package, so a release that has not run
        # their tests is publishing something nothing checked.
        run: |
          for t in Protobuf Avro Yaml Toml Xml; do
            dotnet test "tests/AceMq.Amqp.$t.Tests/AceMq.Amqp.$t.Tests.csproj" \
              --configuration Release --no-build --verbosity normal
          done

      - name: Test against RabbitMQ
        env:
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672
          # The same line ci.yml carries. The blocked-connection test drops the
          # memory high watermark until the broker really blocks the connection,
          # asserts what the health report says, and puts the watermark back —
          # AMQP offers no way to do that, so it goes through the container's
          # CLI. The test refuses to skip when this is missing, which is why the
          # release failed rather than quietly proving nothing.
          ACEMQ_TEST_RABBITMQCTL: docker exec acemq-ci-rabbit rabbitmqctl
        # --no-build, like the test steps above it. Without it this step rebuilds,
        # and a rebuild here does not carry -p:Version — so the assemblies get
        # restamped from Directory.Build.props, and the Pack step below, which
        # packs with --no-build, ships those. The nuspec and the file name would
        # still say the tag's version while the assemblies inside said the tree's.
        # It has never shown because the props is kept in step with the tag by
        # hand, but that is exactly the coupling taking the version from the tag
        # is meant to remove: a workflow_dispatch naming a version the tree does
        # not declare would publish a mismatch, silently.
        #
        # The trx is for the step below. A logger writes a report; it does not build
        # anything, so --no-build above stays the only thing deciding what gets run.
        run: >
          dotnet test tests/AceMq.Amqp.RabbitMq.Tests/AceMq.Amqp.RabbitMq.Tests.csproj
          --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=rabbitmq.trx"
          --results-directory "$RUNNER_TEMP/trx"

      - name: Check nothing skipped
        # A skipped test reads as a pass, and a release is the worst place for that:
        # the artifact is permanent once it reaches the feed, because somebody's
        # lockfile already has it, and "the integration suite was green" is what the
        # decision to publish rests on. Python shipped seven TLS tests that had never
        # executed, reported as "53 passed, 7 skipped" and a green tick, for the
        # whole life of that job.
        #
        # This is the only step in this workflow with a broker in front of it, so it
        # is the only one guarded. Test and "Test the codecs" above run against no
        # broker at all -- everything needing one is in this project by design -- so
        # a skip there would say something about the runner rather than about what is
        # being published.
        #
        # The trx rather than the console summary, and specifically not
        # Counters/@notExecuted: a skipped xUnit test leaves that at zero and shows
        # up only as total > executed and as a result element with
        # outcome="NotExecuted". The full reasoning is written out in ci.yml, which
        # carries the same check on the same suite.
        run: |
          trx="$RUNNER_TEMP/trx/rabbitmq.trx"
          if [ ! -f "$trx" ]; then
            echo "::error::no test report at $trx, so this suite did not run"
            exit 1
          fi
          skipped=$(grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' "$trx" || true)
          if [ -n "$skipped" ]; then
            echo "::error::a test skipped while the broker was running; not publishing"
            printf '%s\n' "$skipped" | sed 's/testName="\([^"]*\)".*/  \1/'
            exit 1
          fi
          counters=$(grep -o '<Counters [^/]*/>' "$trx" || true)
          total=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]total="\([0-9]*\)".*/\1/p')
          ran=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]executed="\([0-9]*\)".*/\1/p')
          if [ -z "$total" ] || [ -z "$ran" ]; then
            echo "::error::$trx carries no result summary"
            exit 1
          fi
          if [ "$total" != "$ran" ]; then
            echo "::error::$total tests were collected but only $ran of them ran"
            exit 1
          fi
          if [ "$ran" -lt 24 ]; then
            echo "::error::only $ran tests ran; this suite has 24"
            exit 1
          fi
          echo "$ran broker tests ran and none skipped"

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet pack --configuration Release --no-build
          "-p:Version=$VERSION"
          --output "$RUNNER_TEMP/packages"

      - name: Check out the NuGet feed
        uses: actions/checkout@v4
        with:
          repository: AceMQ-Company/nuget
          # A deploy key rather than a token: write access to this repository
          # alone, and to nothing else in the organisation.
          ssh-key: ${{ secrets.NUGET_REPO_DEPLOY_KEY }}
          path: nuget-feed

      - name: Add the packages to it
        # Cloned first, then added to, so the version indexes merge with what is
        # already published. Generating them from only this release would leave
        # earlier versions on disk but invisible to any client that reads them.
        working-directory: nuget-feed
        run: ./scripts/publish.sh "$RUNNER_TEMP"/packages/*.nupkg

      # `published` is the line between "nothing happened" and "something is out
      # there". Everything before this leaves the feed untouched; everything after
      # is operating on a version consumers can already resolve.
      - name: Commit and push
        id: push
        working-directory: nuget-feed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "acemq-release"
          git config user.email "noreply@acemq.org"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish; $VERSION may already exist"
            # Already in the feed, so from a consumer's point of view this version
            # is published. Reporting otherwise would make a re-run of a good
            # release look like a release that never happened.
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Publish AceMq.Amqp $VERSION"
          git push origin HEAD
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The only check that asks what a consumer will actually get. Restoring from
      # an empty package cache, against the public feed, catches a release whose
      # artifacts do not match what was pushed -- a failure that otherwise surfaces
      # days later in somebody else's build.
      - name: Verify the published version restores
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          FEED="https://acemq.org/nuget"
          INDEX="$FEED/v3/flatcontainer/acemq.amqp/$VERSION/acemq.amqp.$VERSION.nupkg"
          echo "Waiting for GitHub Pages to serve $VERSION"
          for attempt in $(seq 1 20); do
            # -L because the organisation has a custom domain and every github.io
            # URL answers with a redirect. NuGet follows it; a bare curl does not.
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$INDEX")
            [ "$code" = "200" ] && break
            echo "  attempt $attempt: HTTP $code"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::$VERSION was pushed but is not being served at $INDEX"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          cat > nuget.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="acemq" value="https://acemq.org/nuget/index.json" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
          dotnet new classlib -n Verify -o . --force
          # An empty package cache, so nothing can resolve from what this build
          # just produced. A release that only works on the machine that made it is
          # the failure being guarded against.
          dotnet add package AceMq.Amqp --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          dotnet add package AceMq.Amqp.RabbitMq --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          dotnet add package AceMq.Amqp.Diagnostics --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          dotnet add package AceMq.Amqp.Protobuf --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          dotnet add package AceMq.Amqp.Avro --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          dotnet add package AceMq.Amqp.Yaml --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          dotnet add package AceMq.Amqp.Toml --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          dotnet add package AceMq.Amqp.Xml --version "$VERSION" \
            --package-directory "$RUNNER_TEMP/verify-packages"
          # The tool is downloaded and installed from a local folder, with a config
          # that names *only* that folder.
          #
          # `dotnet tool install` against this feed dies with an unhandled
          # NullReferenceException: a static feed serves only the flat container and
          # the tool installer wants resources it does not have -- the same
          # limitation that makes `dotnet package search` fail, surfacing as a crash
          # rather than a message. --add-source is not enough on its own, because it
          # *adds to* the configured sources rather than replacing them, so the feed
          # is still queried and still crashes. --configfile is what excludes it.
          mkdir -p "$RUNNER_TEMP/tool-source"
          curl -fsSL -o "$RUNNER_TEMP/tool-source/AceMq.Amqp.DevCerts.$VERSION.nupkg" \
            "https://acemq.org/nuget/v3/flatcontainer/acemq.amqp.devcerts/$VERSION/acemq.amqp.devcerts.$VERSION.nupkg"
          cat > "$RUNNER_TEMP/tool-source/nuget.config" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear />
            <add key="local" value="$RUNNER_TEMP/tool-source" />
          </packageSources></configuration>
          XML
          dotnet tool install --tool-path "$RUNNER_TEMP/verify-tool" \
            AceMq.Amqp.DevCerts --version "$VERSION" \
            --configfile "$RUNNER_TEMP/tool-source/nuget.config"
          "$RUNNER_TEMP/verify-tool/acemq-certs" --out "$RUNNER_TEMP/verify-certs" --days 1
          test -f "$RUNNER_TEMP/verify-certs/ca.crt"
          echo "$VERSION restores from a clean cache."

      - name: Where it landed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "Published AceMq.Amqp, AceMq.Amqp.RabbitMq, AceMq.Amqp.Diagnostics"
          echo "and the AceMq.Amqp.DevCerts tool, $VERSION"
          echo "Feed: https://acemq.org/nuget/"

  # The GitHub release is what people subscribe to. Created after the feed push, so
  # it never advertises a version that failed to publish.
  announce:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "AceMQ for .NET $VERSION.

          \`\`\`bash
          dotnet nuget add source https://acemq.org/nuget/index.json --name acemq
          dotnet add package AceMq.Amqp --version $VERSION
          dotnet add package AceMq.Amqp.RabbitMq --version $VERSION
          \`\`\`

          Documentation: https://acemq.org/acemq-dotnet-amqp/" \
            || echo "release v$VERSION already exists"

  # The organisation landing page shows the current release on its .NET card. Left
  # to a manual step it drifts, which is worse than saying nothing: a reader copies
  # a version that is no longer current.
  landing-page:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AceMQ-Company/AceMQ-Company.github.io
          ssh-key: ${{ secrets.LANDING_PAGE_DEPLOY_KEY }}
      - name: Show this release on the landing page
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PYTHON'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("index.html")
          text = path.read_text()
          # The .NET card's badge, and nothing else on the page. Anchored on the
          # repository link so a version elsewhere cannot be caught by accident.
          pattern = re.compile(
              r'(acemq-dotnet-amqp">AceMQ for \.NET</a>\s*\n\s*<span class="badge)'
              r'[^>]*>[^<]*(</span>)')
          updated, n = pattern.subn(
              lambda m: f'{m.group(1) } live">{version}{m.group(2)}', text)
          if n == 0:
              print("::warning::the .NET card was not found; leaving the page alone")
          elif updated != text:
              path.write_text(updated)
              print(f"the .NET card now shows {version}")
          PYTHON
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "acemq-release"
            git config user.email "noreply@acemq.org"
            git commit -am "AceMQ for .NET $VERSION"
            git push origin HEAD
          else
            echo "landing page already current"
          fi

  # A version that is published but did not finish its release is the genuinely
  # dangerous state: consumers can already resolve it while the documentation and
  # the landing page still name the previous one. That is worth interrupting
  # someone for, which is why this fires on success as well as failure -- unlike
  # the documentation build, where only failures are worth a message.
  notify:
    needs: [publish, announce, landing-page]
    if: always() && needs.publish.outputs.published == 'true'
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: >-
        ${{ (needs.announce.result == 'success' && needs.landing-page.result == 'success')
            && 'success' || 'failure' }}
      title: >-
        ${{ (needs.announce.result == 'success' && needs.landing-page.result == 'success')
            && format('AceMQ for .NET {0} released', github.ref_name)
            || format('AceMQ for .NET {0} is published but the release did not finish', github.ref_name) }}
      message: >-
        ${{ (needs.announce.result == 'success' && needs.landing-page.result == 'success')
            && 'The packages and the acemq-certs tool are on the NuGet feed. Consumers need no credentials.'
            || 'The packages are on the feed and consumers can resolve them, but a later step failed, so the release notes or the landing page may still name the previous version. Check the run.' }}
      # Roadworks rather than a red dot for the half-finished case: the release is
      # usable and unfinished, which is a different thing from broken and reads
      # differently at a glance.
      #
      # Both branches name an emoji. Leaving the success branch empty to fall back
      # on the status-derived tick does not work -- in GitHub's expression language
      # `a && '' || b` yields b, because an empty string is falsy, so every
      # successful release would be announced with roadworks. That cost the Java
      # library nine releases before anyone noticed.
      icon: >-
        ${{ (needs.announce.result == 'success' && needs.landing-page.result == 'success')
            && ':white_check_mark:' || ':construction:' }}
      url: https://acemq.org/nuget/
    secrets:
      # Explicit, not `inherit`. A reusable workflow in another repository does not
      # receive inherited secrets, so `inherit` produced a notify job that went
      # green while sending nothing at all.
      SLACK_DELIVERY_WEBHOOK: ${{ secrets.SLACK_DELIVERY_WEBHOOK }}
