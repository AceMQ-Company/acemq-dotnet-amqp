# Build the documentation site and publish it to GitHub Pages.
#
# The site is the markdown under docs/ rendered to HTML, plus the API reference
# under /apidocs/, generated by DocFX from the XML documentation in the source.
#
# The reference is part of the site rather than an afterthought. These packages
# are not on nuget.org, so nothing else will host it, and generating it from the
# same commit as the prose is what stops the two drifting apart.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/build-docs-site.sh'
      - 'src/**'
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a waiting one rather than
# racing it. In-progress runs are allowed to finish so a half-published site is
# never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege for every job that does not ask for more. Jobs needing more
# declare it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        # Pinned, so a new DocFX cannot change the rendered reference without
        # somebody choosing it.
        run: |
          dotnet tool install -g docfx --version 2.78.5
          # Global tools are not on PATH for later steps by default. Without this
          # the site build fails -- which it should, and used to skip instead,
          # publishing a navigation entry that pointed at a 404.
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Render the pages
        run: bash .github/scripts/build-docs-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A job's own block replaces the workflow default rather than adding to it,
    # so contents is repeated here. This is GitHub's own deploy-pages triple.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
