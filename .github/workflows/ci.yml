# Build, test, and compile both example languages.
#
# The VB sample is built here deliberately. VB.NET is not a separate library -- it
# references the same assembly -- but it can only keep doing that if the public API
# stays callable from VB, and a rule nothing checks is a rule that has already been
# broken. The first VB sample written for this repository failed to compile on a
# case-insensitivity rule that C# does not have.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        # The conformance tests assert against headers generated from the Java
        # library. A failure here means the two implementations have diverged.
        run: >
          dotnet test tests/AceMq.Amqp.Tests/AceMq.Amqp.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Compile and run the C# example
        run: dotnet run --project examples/csharp --configuration Release

      - name: Compile and run the VB.NET example
        run: dotnet run --project examples/vb --configuration Release

      - name: Audit the public API for VB
        # VB is case-insensitive, has no ref struct or Span<T>, and resolves optional
        # arguments differently. Each is a compile error for a VB consumer that C#
        # never sees, so the surface is checked by reflection rather than by eye --
        # and the audit self-checks against a deliberately bad type, because a rule
        # that never fires is indistinguishable from one that is not running.
        run: dotnet run --project tools/vb-audit --configuration Release

      - name: Verify every assembly targets netstandard2.0
        # The reach promise: .NET Framework 4.6.2+ as well as modern .NET. A
        # retarget would quietly drop the consumers this library exists to serve --
        # and it has to hold for the transport too, or the promise only covers code
        # that never talks to a broker.
        run: |
          for p in src/AceMq.Amqp/AceMq.Amqp.csproj src/AceMq.Amqp.RabbitMq/AceMq.Amqp.RabbitMq.csproj src/AceMq.Amqp.Diagnostics/AceMq.Amqp.Diagnostics.csproj; do
            grep -q '<TargetFramework>netstandard2.0</TargetFramework>' "$p" \
              || { echo "$p no longer targets netstandard2.0"; exit 1; }
            echo "netstandard2.0 confirmed: $p"
          done

  integration:
    # The RabbitMQ transport, against a real broker. This job has no skip path: an
    # integration suite that quietly does nothing when the broker is missing reports
    # a green tick for work nobody did.
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test against RabbitMQ
        env:
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672
        run: >
          dotnet test tests/AceMq.Amqp.RabbitMq.Tests/AceMq.Amqp.RabbitMq.Tests.csproj
          --configuration Release --verbosity normal
