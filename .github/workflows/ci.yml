# Build, test, and compile both example languages.
#
# The VB sample is built here deliberately. VB.NET is not a separate library -- it
# references the same assembly -- but it can only keep doing that if the public API
# stays callable from VB, and a rule nothing checks is a rule that has already been
# broken. The first VB sample written for this repository failed to compile on a
# case-insensitivity rule that C# does not have.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        # The conformance tests assert against headers generated from the Java
        # library. A failure here means the two implementations have diverged.
        run: >
          dotnet test tests/AceMq.Amqp.Tests/AceMq.Amqp.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the Protobuf codec
        # Its own project because it needs protoc, which Grpc.Tools runs at build
        # time. Keeping it out of the main suite keeps that tool out of everything
        # that does not need it.
        run: >
          dotnet test tests/AceMq.Amqp.Protobuf.Tests/AceMq.Amqp.Protobuf.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the Avro codec
        run: >
          dotnet test tests/AceMq.Amqp.Avro.Tests/AceMq.Amqp.Avro.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the YAML codec
        run: >
          dotnet test tests/AceMq.Amqp.Yaml.Tests/AceMq.Amqp.Yaml.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the TOML codec
        run: >
          dotnet test tests/AceMq.Amqp.Toml.Tests/AceMq.Amqp.Toml.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the XML codec
        # Its interop tests decode base64 bodies the Java and Go libraries really
        # wrote, read from a fixture the build copies beside the test assembly. The
        # build above is what puts it there, so this step must not be reordered
        # ahead of it.
        run: >
          dotnet test tests/AceMq.Amqp.Xml.Tests/AceMq.Amqp.Xml.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test payload encryption
        # The one suite that can catch a wire format only .NET can read. It decrypts
        # base64 bodies the Java, Python and Ruby libraries really wrote, from a
        # fixture the build copies beside the test assembly, and pins the exact bytes
        # this package writes for a known key and nonce. Every encryption test up to
        # 0.3.0 passed while nothing else in the family could read a word of it,
        # because every one of them decrypted what it had itself encrypted.
        #
        # The build above is what puts the fixture there, so this step must not be
        # reordered ahead of it.
        run: >
          dotnet test tests/AceMq.Amqp.Crypto.Tests/AceMq.Amqp.Crypto.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Compile and run the C# example
        run: dotnet run --project examples/csharp --configuration Release

      - name: Compile and run the VB.NET example
        run: dotnet run --project examples/vb --configuration Release

      - name: Audit the public API for VB
        # VB is case-insensitive, has no ref struct or Span<T>, and resolves optional
        # arguments differently. Each is a compile error for a VB consumer that C#
        # never sees, so the surface is checked by reflection rather than by eye --
        # and the audit self-checks against a deliberately bad type, because a rule
        # that never fires is indistinguishable from one that is not running.
        run: dotnet run --project tools/vb-audit --configuration Release

      - name: Verify every assembly still builds for netstandard2.0
        # The reach promise: .NET Framework 4.6.2+ as well as modern .NET. A
        # retarget would quietly drop the consumers this library exists to serve --
        # and it has to hold for the transport too, or the promise only covers code
        # that never talks to a broker.
        #
        # Every package multi-targets netstandard2.0;net8.0 since 0.6.0, so this
        # checks the built assembly rather than the project file. It used to grep for
        # a literal <TargetFramework>netstandard2.0</TargetFramework>, which a
        # multi-target breaks even when both targets are there -- and a check that
        # fails on the correct answer gets relaxed rather than fixed. The output
        # directory cannot be fooled: the assembly is there because it compiled.
        run: |
          for p in AceMq.Amqp AceMq.Amqp.RabbitMq AceMq.Amqp.Diagnostics AceMq.Amqp.Protobuf AceMq.Amqp.Avro AceMq.Amqp.Yaml AceMq.Amqp.Toml AceMq.Amqp.Xml AceMq.Amqp.Crypto; do
            test -f "src/$p/bin/Release/netstandard2.0/$p.dll" \
              || { echo "$p no longer builds for netstandard2.0"; exit 1; }
            echo "netstandard2.0 confirmed: $p"
          done

      - name: Verify every package ships both targets
        # Multi-targeting is only real if it reaches the package. A project that
        # builds netstandard2.0 into bin and ships one lib folder is a promise the
        # consumer never sees.
        run: |
          dotnet pack --configuration Release --no-build -o "$RUNNER_TEMP/packages"
          for p in AceMq.Amqp AceMq.Amqp.RabbitMq AceMq.Amqp.Diagnostics AceMq.Amqp.Protobuf AceMq.Amqp.Avro AceMq.Amqp.Yaml AceMq.Amqp.Toml AceMq.Amqp.Xml AceMq.Amqp.Crypto; do
            # The [0-9] anchors on the version, so AceMq.Amqp does not match
            # AceMq.Amqp.Avro and check the wrong package.
            nupkg=$(find "$RUNNER_TEMP/packages" -name "$p.[0-9]*.nupkg" | head -1)
            for tfm in netstandard2.0 net8.0; do
              unzip -l "$nupkg" | grep -q "lib/$tfm/$p.dll" \
                || { echo "$p ships no lib/$tfm"; exit 1; }
            done
            echo "both targets confirmed: $p"
          done

  integration:
    # The RabbitMQ transport, against a real broker. This job has no skip path: an
    # integration suite that quietly does nothing when the broker is missing reports
    # a green tick for work nobody did.
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --name acemq-ci-rabbit
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test against RabbitMQ
        env:
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672
          # How the suite reaches rabbitmqctl, which AMQP offers no equivalent of and
          # which the blocked-connection test needs: it drops the memory high
          # watermark until the broker really blocks the connection, asserts what the
          # health report says about it, and puts the watermark back. The service
          # container is given a fixed --name above so this line can address it; a
          # test that could only assert on a flag it set itself would prove nothing.
          ACEMQ_TEST_RABBITMQCTL: docker exec acemq-ci-rabbit rabbitmqctl
        # The trx exists for the step below and for nothing else. The console
        # summary is written for a person reading the log; the trx is the runner's
        # own record of what it did, and that is what gets judged.
        run: >
          dotnet test tests/AceMq.Amqp.RabbitMq.Tests/AceMq.Amqp.RabbitMq.Tests.csproj
          --configuration Release --verbosity normal
          --logger "trx;LogFileName=rabbitmq.trx"
          --results-directory "$RUNNER_TEMP/trx"

      - name: Check nothing skipped
        # A skipped test reads as a pass. Python carried seven TLS tests that had
        # never once executed, reported as "53 passed, 7 skipped" and a green tick,
        # for the entire life of that job -- nothing failed, so nobody looked. Go and
        # Python both fail their build on a skip now; this is the .NET half of that.
        #
        # Guarded here and in the tls job below, and on the release's own run of this
        # same suite. Those three are the steps that run with a broker in front of
        # them, so every test they collect is meant to execute and a skip is a hole.
        # The build job's suites are exempt on purpose: they run with no broker at
        # all, by design -- anything needing one lives in its own project precisely
        # so it cannot pretend to have run -- so a skip there would be a statement
        # about the runner rather than about the library.
        #
        # The trx rather than the console summary, for two reasons. `dotnet test`
        # prints a "Skipped:" line only when the count is not zero, so grepping the
        # log is a check on the absence of a line: it cannot tell a clean run from a
        # run whose summary never appeared, and the summary's shape has already
        # changed once between SDK versions. And the trx names the tests that did not
        # run, which is the thing that was missing in Python -- seven tests nobody
        # could name without going back to the logs.
        #
        # Counters/@notExecuted is not the field to read, however much it sounds like
        # it. A skipped xUnit test leaves it at zero; the skip shows up only as
        # total > executed and as a result element carrying outcome="NotExecuted".
        # That was established by making a test skip on purpose and reading what the
        # runner wrote, not by reading the schema.
        run: |
          trx="$RUNNER_TEMP/trx/rabbitmq.trx"
          if [ ! -f "$trx" ]; then
            echo "::error::no test report at $trx, so this suite did not run"
            exit 1
          fi
          skipped=$(grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' "$trx" || true)
          if [ -n "$skipped" ]; then
            echo "::error::a test skipped while the broker was running"
            printf '%s\n' "$skipped" | sed 's/testName="\([^"]*\)".*/  \1/'
            exit 1
          fi
          counters=$(grep -o '<Counters [^/]*/>' "$trx" || true)
          total=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]total="\([0-9]*\)".*/\1/p')
          ran=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]executed="\([0-9]*\)".*/\1/p')
          if [ -z "$total" ] || [ -z "$ran" ]; then
            echo "::error::$trx carries no result summary"
            exit 1
          fi
          # The same thing said a second way, because a skip that never reaches a
          # result element -- a whole class dropped at discovery, say -- still leaves
          # these two numbers apart.
          if [ "$total" != "$ran" ]; then
            echo "::error::$total tests were collected but only $ran of them ran"
            exit 1
          fi
          # A suite that quietly shrinks is the same defect arriving by a different
          # road: nothing skips, nothing fails, and half the tests are simply no
          # longer there. Raise this when tests are added; lower it only when one is
          # deliberately removed.
          if [ "$ran" -lt 24 ]; then
            echo "::error::only $ran tests ran; this suite has 24"
            exit 1
          fi
          echo "$ran broker tests ran and none skipped"

  compatibility:
    name: integration tests on RabbitMQ 3.13
    # "Works with RabbitMQ 3.13" was a claim nothing checked: the integration job
    # above and the release's own run of the same suite both pin rabbitmq:4, so the
    # only broker this library had ever been tested against was the current major.
    # 3.13 is the version most production estates are actually on, and the one an
    # upgrade is being planned away from rather than towards -- which is exactly when
    # somebody needs to know whether the client still behaves.
    #
    # A separate job rather than a matrix dimension on the integration job, which is
    # the shape that would otherwise be obvious here because that job carries no
    # matrix at all. Two reasons. The check name is the first: a matrix renames the
    # existing check from "integration" to "integration (rabbitmq:4-management)", and
    # anything naming the old one -- branch protection above all -- stops matching a
    # check that no longer exists. Renaming a required check while adding coverage is
    # a poor trade. The second is that the two runs are not the same claim and will
    # not have the same lifetime: the 4.x run says the library works, this one says it
    # has not yet dropped the previous major, and the day 3.13 goes out of support
    # this job gets deleted whole. A deleted job is a visible diff; a deleted matrix
    # row is a one-line change nobody reads.
    #
    # The plaintext suite only, and not the TLS suite below. The TLS suite was run
    # against a 3.13 broker by hand before this job was written and all nine tests
    # pass, so this is a choice about what is worth repeating rather than a gap: eight
    # of those nine assert on the client's own certificate verification -- an unknown
    # authority refused, a development certificate refused, a chain that does not
    # reach the trusted root refused -- and that code runs before the broker has said
    # a word about its version, so it cannot branch on one. The ninth proves a
    # handshake completes, which tests the runner's OpenSSL and the broker's Erlang
    # TLS terminator rather than anything in this library. What genuinely did change
    # between the two majors is on the AMQP 0-9-1 side the suite below covers:
    # queue-type defaults, dead-letter republishing, basic.get replay, the stream
    # consumer arguments, and the shape of the memory alarm.
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --name acemq-ci-rabbit-313
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test against RabbitMQ 3.13
        env:
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672
          # The same mechanism the 4.x job uses, pointed at this job's container: the
          # blocked-connection test drops the memory high watermark through rabbitmqctl
          # because AMQP offers no way to ask a broker to block you. The --name above
          # is what this line addresses, and it differs from the 4.x job's name so that
          # neither job can be read as reaching into the other's broker.
          ACEMQ_TEST_RABBITMQCTL: docker exec acemq-ci-rabbit-313 rabbitmqctl
        run: >
          dotnet test tests/AceMq.Amqp.RabbitMq.Tests/AceMq.Amqp.RabbitMq.Tests.csproj
          --configuration Release --verbosity normal
          --logger "trx;LogFileName=rabbitmq-3.13.trx"
          --results-directory "$RUNNER_TEMP/trx"

      - name: Check nothing skipped
        # Why the trx rather than the console summary, and why Counters/@notExecuted is
        # the wrong field to read, is written out over the integration job's copy of
        # this step. The guard matters more here than there: this job exists for no
        # other purpose than to prove the suite passes against 3.13, so a test that
        # quietly stopped running would leave the entire compatibility claim resting on
        # a green tick and nothing else. The obvious way for that to happen is somebody
        # reaching for a conditional skip the first time a test misbehaves on the older
        # broker, which is precisely the outcome worth reporting rather than hiding.
        run: |
          trx="$RUNNER_TEMP/trx/rabbitmq-3.13.trx"
          if [ ! -f "$trx" ]; then
            echo "::error::no test report at $trx, so this suite did not run"
            exit 1
          fi
          skipped=$(grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' "$trx" || true)
          if [ -n "$skipped" ]; then
            echo "::error::a test skipped while the 3.13 broker was running"
            printf '%s\n' "$skipped" | sed 's/testName="\([^"]*\)".*/  \1/'
            exit 1
          fi
          counters=$(grep -o '<Counters [^/]*/>' "$trx" || true)
          total=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]total="\([0-9]*\)".*/\1/p')
          ran=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]executed="\([0-9]*\)".*/\1/p')
          if [ -z "$total" ] || [ -z "$ran" ]; then
            echo "::error::$trx carries no result summary"
            exit 1
          fi
          if [ "$total" != "$ran" ]; then
            echo "::error::$total tests were collected but only $ran of them ran"
            exit 1
          fi
          # The same floor as the 4.x job, because both brokers run the whole suite:
          # 24 collected, 24 executed, nothing skipped on either. That was measured on
          # a real 3.13.7 container before this job was committed, not assumed from the
          # other job's number. Keeping the two floors equal is the point -- the day
          # 3.13 can only manage 23, the honest response is to work out which test that
          # is and say so, not to lower this line until the job goes green again.
          if [ "$ran" -lt 24 ]; then
            echo "::error::only $ran tests ran; this suite has 24"
            exit 1
          fi
          echo "$ran broker tests ran on 3.13 and none skipped"

  tls:
    # TLS against a broker with a privately issued certificate. Started with
    # docker run rather than as a service, because the certificates have to be
    # generated first and a service container starts before any step runs.
    #
    # Against rabbitmq:4 only. The compatibility job above says why running this
    # suite on 3.13 as well would buy nothing that job does not already buy.
    #
    # No skip path, deliberately: this is the most security-sensitive code in the
    # library, and a suite that quietly does nothing when the broker is absent
    # would report a green tick for exactly the thing nobody wants unverified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Make the certificates
        # The library's own generator rather than openssl. It uses the framework's
        # certificate API, so this step behaves the same on any runner and the job
        # stops depending on a tool that happens to be installed -- and it exercises
        # the generator on every run rather than only when somebody remembers to.
        run: |
          dotnet run --project src/AceMq.Amqp.DevCerts --configuration Release -- \
            --out certs --broker localhost --days 2 --broker-certs /certs
          chmod 644 certs/server.key   # the broker container runs as its own user

      - name: Start a broker that speaks TLS
        # rabbitmq.conf comes from the generator too, so the broker configuration
        # and the certificates cannot describe different paths.
        run: |
          docker run -d --name acemq-tls -p 5671:5671 \
            -v "$PWD/certs":/certs:ro \
            -v "$PWD/certs/rabbitmq.conf":/etc/rabbitmq/rabbitmq.conf:ro \
            rabbitmq:4-management
          for i in $(seq 1 60); do
            if docker logs acemq-tls 2>&1 | grep -q "started TLS (SSL) listener"; then
              echo "TLS listener up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the TLS listener never came up"
          docker logs acemq-tls
          exit 1

      - name: Test over TLS
        env:
          ACEMQ_TEST_AMQPS_URL: amqps://guest:guest@localhost:5671
          # Absolute: the test runs from its own output directory, not the
          # workspace root, and a relative path silently resolves to nothing there.
          ACEMQ_TEST_CA: ${{ github.workspace }}/certs/ca.crt
        run: >
          dotnet test tests/AceMq.Amqp.Tls.Tests/AceMq.Amqp.Tls.Tests.csproj
          --configuration Release --verbosity normal
          --logger "trx;LogFileName=tls.trx"
          --results-directory "$RUNNER_TEMP/trx"

      - name: Check nothing skipped
        # The reasoning, and why the trx rather than the console, is written out over
        # the integration job's copy of this step. It matters more here than anywhere
        # else in the file: the tests worth having in this suite are the ones that
        # assert a refusal -- an unknown authority rejected, a development
        # certificate refused -- and a verification that is not happening looks
        # exactly like one that is, right up until somebody checks that it still says
        # no. Python's seven silent tests were TLS tests, for the same reason.
        run: |
          trx="$RUNNER_TEMP/trx/tls.trx"
          if [ ! -f "$trx" ]; then
            echo "::error::no test report at $trx, so this suite did not run"
            exit 1
          fi
          skipped=$(grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' "$trx" || true)
          if [ -n "$skipped" ]; then
            echo "::error::a test skipped while the TLS broker was running"
            printf '%s\n' "$skipped" | sed 's/testName="\([^"]*\)".*/  \1/'
            exit 1
          fi
          counters=$(grep -o '<Counters [^/]*/>' "$trx" || true)
          total=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]total="\([0-9]*\)".*/\1/p')
          ran=$(printf '%s' "$counters" | sed -n 's/.*[[:space:]]executed="\([0-9]*\)".*/\1/p')
          if [ -z "$total" ] || [ -z "$ran" ]; then
            echo "::error::$trx carries no result summary"
            exit 1
          fi
          if [ "$total" != "$ran" ]; then
            echo "::error::$total tests were collected but only $ran of them ran"
            exit 1
          fi
          if [ "$ran" -lt 9 ]; then
            echo "::error::only $ran tests ran; this suite has 9"
            exit 1
          fi
          echo "$ran TLS tests ran and none skipped"

  badge-matches-the-release:
    name: the README badge names the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the version badge against the newest release tag
        # A README badge is the first thing a reader sees and nothing keeps it
        # in step. This one said 0.1.4 while the library was at 0.7.0 -- six
        # minor versions, sitting at the top of the page, wrong since 0.1.4 was
        # the truth. acemq-java-amqp stays correct only because its release
        # rewrites the documented version; every other repository updates the
        # badge by hand, which means sometimes.
        #
        # Tags come from ls-remote so this needs no token on a scheduled run.
        # Only plain vX.Y.Z tags count: Go publishes nested modules as
        # codec/avro/vX.Y.Z, and those are not the repository's version.
        run: |
          newest=$(git ls-remote --tags origin \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          badge=$(grep -oE 'badge/version-[0-9][0-9.]*' README.md | head -1 | sed 's|badge/version-||')

          if [ -z "$newest" ]; then
            echo "no release tags yet, so there is nothing for the badge to disagree with"
            exit 0
          fi
          if [ -z "$badge" ]; then
            echo "::error::no version badge found in README.md, so this check cannot do its job"
            exit 1
          fi
          # Behind is the failure; ahead is a release being prepared.
          #
          # The badge is bumped in the commit that readies a release, which is
          # pushed before the tag exists -- so for a few minutes the badge names
          # a version no tag does. Failing on any difference would redden that
          # commit and block the release it is part of, which is the check
          # sabotaging the thing it is meant to protect. Only a badge older than
          # the newest release is wrong.
          older=$(printf '%s\n%s\n' "$badge" "$newest" | sort -V | head -1)
          if [ "$badge" != "$newest" ] && [ "$older" = "$badge" ]; then
            echo "::error::the README badge says $badge but the newest release is $newest."
            echo "::error::Edit the version badge in README.md and set it to $newest."
            exit 1
          fi
          if [ "$badge" != "$newest" ]; then
            echo "the badge says $badge and the newest release is $newest; a release looks to be in flight"
            exit 0
          fi
          echo "the badge says $badge, which is the newest release"
