# Build, test, and compile both example languages.
#
# The VB sample is built here deliberately. VB.NET is not a separate library -- it
# references the same assembly -- but it can only keep doing that if the public API
# stays callable from VB, and a rule nothing checks is a rule that has already been
# broken. The first VB sample written for this repository failed to compile on a
# case-insensitivity rule that C# does not have.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        # The conformance tests assert against headers generated from the Java
        # library. A failure here means the two implementations have diverged.
        run: >
          dotnet test tests/AceMq.Amqp.Tests/AceMq.Amqp.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the Protobuf codec
        # Its own project because it needs protoc, which Grpc.Tools runs at build
        # time. Keeping it out of the main suite keeps that tool out of everything
        # that does not need it.
        run: >
          dotnet test tests/AceMq.Amqp.Protobuf.Tests/AceMq.Amqp.Protobuf.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the Avro codec
        run: >
          dotnet test tests/AceMq.Amqp.Avro.Tests/AceMq.Amqp.Avro.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the YAML codec
        run: >
          dotnet test tests/AceMq.Amqp.Yaml.Tests/AceMq.Amqp.Yaml.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the TOML codec
        run: >
          dotnet test tests/AceMq.Amqp.Toml.Tests/AceMq.Amqp.Toml.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test the XML codec
        # Its interop tests decode base64 bodies the Java and Go libraries really
        # wrote, read from a fixture the build copies beside the test assembly. The
        # build above is what puts it there, so this step must not be reordered
        # ahead of it.
        run: >
          dotnet test tests/AceMq.Amqp.Xml.Tests/AceMq.Amqp.Xml.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Test payload encryption
        # The one suite that can catch a wire format only .NET can read. It decrypts
        # base64 bodies the Java, Python and Ruby libraries really wrote, from a
        # fixture the build copies beside the test assembly, and pins the exact bytes
        # this package writes for a known key and nonce. Every encryption test up to
        # 0.3.0 passed while nothing else in the family could read a word of it,
        # because every one of them decrypted what it had itself encrypted.
        #
        # The build above is what puts the fixture there, so this step must not be
        # reordered ahead of it.
        run: >
          dotnet test tests/AceMq.Amqp.Crypto.Tests/AceMq.Amqp.Crypto.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Compile and run the C# example
        run: dotnet run --project examples/csharp --configuration Release

      - name: Compile and run the VB.NET example
        run: dotnet run --project examples/vb --configuration Release

      - name: Audit the public API for VB
        # VB is case-insensitive, has no ref struct or Span<T>, and resolves optional
        # arguments differently. Each is a compile error for a VB consumer that C#
        # never sees, so the surface is checked by reflection rather than by eye --
        # and the audit self-checks against a deliberately bad type, because a rule
        # that never fires is indistinguishable from one that is not running.
        run: dotnet run --project tools/vb-audit --configuration Release

      - name: Verify every assembly still builds for netstandard2.0
        # The reach promise: .NET Framework 4.6.2+ as well as modern .NET. A
        # retarget would quietly drop the consumers this library exists to serve --
        # and it has to hold for the transport too, or the promise only covers code
        # that never talks to a broker.
        #
        # Every package multi-targets netstandard2.0;net8.0 since 0.6.0, so this
        # checks the built assembly rather than the project file. It used to grep for
        # a literal <TargetFramework>netstandard2.0</TargetFramework>, which a
        # multi-target breaks even when both targets are there -- and a check that
        # fails on the correct answer gets relaxed rather than fixed. The output
        # directory cannot be fooled: the assembly is there because it compiled.
        run: |
          for p in AceMq.Amqp AceMq.Amqp.RabbitMq AceMq.Amqp.Diagnostics AceMq.Amqp.Protobuf AceMq.Amqp.Avro AceMq.Amqp.Yaml AceMq.Amqp.Toml AceMq.Amqp.Xml AceMq.Amqp.Crypto; do
            test -f "src/$p/bin/Release/netstandard2.0/$p.dll" \
              || { echo "$p no longer builds for netstandard2.0"; exit 1; }
            echo "netstandard2.0 confirmed: $p"
          done

      - name: Verify every package ships both targets
        # Multi-targeting is only real if it reaches the package. A project that
        # builds netstandard2.0 into bin and ships one lib folder is a promise the
        # consumer never sees.
        run: |
          dotnet pack --configuration Release --no-build -o "$RUNNER_TEMP/packages"
          for p in AceMq.Amqp AceMq.Amqp.RabbitMq AceMq.Amqp.Diagnostics AceMq.Amqp.Protobuf AceMq.Amqp.Avro AceMq.Amqp.Yaml AceMq.Amqp.Toml AceMq.Amqp.Xml AceMq.Amqp.Crypto; do
            # The [0-9] anchors on the version, so AceMq.Amqp does not match
            # AceMq.Amqp.Avro and check the wrong package.
            nupkg=$(find "$RUNNER_TEMP/packages" -name "$p.[0-9]*.nupkg" | head -1)
            for tfm in netstandard2.0 net8.0; do
              unzip -l "$nupkg" | grep -q "lib/$tfm/$p.dll" \
                || { echo "$p ships no lib/$tfm"; exit 1; }
            done
            echo "both targets confirmed: $p"
          done

  integration:
    # The RabbitMQ transport, against a real broker. This job has no skip path: an
    # integration suite that quietly does nothing when the broker is missing reports
    # a green tick for work nobody did.
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test against RabbitMQ
        env:
          ACEMQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672
        run: >
          dotnet test tests/AceMq.Amqp.RabbitMq.Tests/AceMq.Amqp.RabbitMq.Tests.csproj
          --configuration Release --verbosity normal

  tls:
    # TLS against a broker with a privately issued certificate. Started with
    # docker run rather than as a service, because the certificates have to be
    # generated first and a service container starts before any step runs.
    #
    # No skip path, deliberately: this is the most security-sensitive code in the
    # library, and a suite that quietly does nothing when the broker is absent
    # would report a green tick for exactly the thing nobody wants unverified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.x as well as 10.0.x, for the net8.0 half of the multi-target. The
          # 10 SDK can build net8.0 by downloading the targeting pack from NuGet,
          # which works until the day it does not; installing the SDK that carries
          # it makes the build depend on the runner rather than on a fetch.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Make the certificates
        # The library's own generator rather than openssl. It uses the framework's
        # certificate API, so this step behaves the same on any runner and the job
        # stops depending on a tool that happens to be installed -- and it exercises
        # the generator on every run rather than only when somebody remembers to.
        run: |
          dotnet run --project src/AceMq.Amqp.DevCerts --configuration Release -- \
            --out certs --broker localhost --days 2 --broker-certs /certs
          chmod 644 certs/server.key   # the broker container runs as its own user

      - name: Start a broker that speaks TLS
        # rabbitmq.conf comes from the generator too, so the broker configuration
        # and the certificates cannot describe different paths.
        run: |
          docker run -d --name acemq-tls -p 5671:5671 \
            -v "$PWD/certs":/certs:ro \
            -v "$PWD/certs/rabbitmq.conf":/etc/rabbitmq/rabbitmq.conf:ro \
            rabbitmq:4-management
          for i in $(seq 1 60); do
            if docker logs acemq-tls 2>&1 | grep -q "started TLS (SSL) listener"; then
              echo "TLS listener up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the TLS listener never came up"
          docker logs acemq-tls
          exit 1

      - name: Test over TLS
        env:
          ACEMQ_TEST_AMQPS_URL: amqps://guest:guest@localhost:5671
          # Absolute: the test runs from its own output directory, not the
          # workspace root, and a relative path silently resolves to nothing there.
          ACEMQ_TEST_CA: ${{ github.workspace }}/certs/ca.crt
        run: >
          dotnet test tests/AceMq.Amqp.Tls.Tests/AceMq.Amqp.Tls.Tests.csproj
          --configuration Release --verbosity normal
