syntax = "proto3";

package acemq.test;
option csharp_namespace = "AceMq.Amqp.Protobuf.Tests";

// A message generated by protoc, because that is the only thing this codec
// serves and a hand-written stand-in would not prove it works.
message OrderPlaced {
  string order_id = 1;
  int64  total_cents = 2;
  string tenant = 3;
}
