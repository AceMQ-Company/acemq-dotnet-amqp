- api3: AllowUnroutable()
  id: AceMq_Amqp_PublishOptions_AllowUnroutable
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Publishing.cs#L55
  metadata:
    uid: AceMq.Amqp.PublishOptions.AllowUnroutable
    commentId: M:AceMq.Amqp.PublishOptions.AllowUnroutable
- markdown: Lets the broker discard a message that matches no binding.
- code: public PublishOptions AllowUnroutable()
- h4: Returns
- parameters:
  - type:
    - text: PublishOptions
      url: AceMq.Amqp.PublishOptions.html
- h4: Remarks
- markdown: >-
    The default reports it as a failure instead, because an unroutable message

    is nearly always a topology mistake and this is the cheapest moment to find

    out. Use this where the discard is the intent.
