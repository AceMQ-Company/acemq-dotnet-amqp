- markdown: Pauses consuming and waits for handlers already running to finish.
- code: public Task<bool> DrainConsumersAsync(TimeSpan timeout)
- h4: Parameters
- parameters:
  - name: timeout
    type:
    - text: TimeSpan
      url: https://learn.microsoft.com/dotnet/api/system.timespan
- h4: Returns
- parameters:
  - type:
    - text: Task
      url: https://learn.microsoft.com/dotnet/api/system.threading.tasks.task-1
    - <
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
    - '>'
    description: True if everything finished within the timeout.
- h4: Remarks
- markdown: >-
    What to call before shutting down. Disposing the connection while handlers are

    mid-flight abandons their work: the messages were never acknowledged so they

    come back, but any side effect already applied has happened twice by the time

    they do. Draining first turns a rolling deploy into an orderly handover.
