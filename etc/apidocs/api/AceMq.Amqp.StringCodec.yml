- h2: Remarks
- markdown: >-
    Distinct from <xref href="AceMq.Amqp.BytesCodec" data-throw-if-not-resolved="false"></xref> in what it says about itself: this

    declares <code>text/plain</code>, so a consumer reading the content type knows it is

    looking at text rather than at an opaque blob.
