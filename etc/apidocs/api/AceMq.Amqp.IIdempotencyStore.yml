- markdown: Remembers which messages have already been handled.
- code: public interface IIdempotencyStore
- h2: Remarks
- markdown: >-
    <p>

    Every broker worth using delivers at least once, so a consumer will eventually see

    the same message twice: a redelivery after a crash, a retry that actually

    succeeded, an outbox relay that published before it recorded doing so. If handling

    a message twice is not safe, something has to remember.

    </p>

    <p>

    The three states matter. <xref href="AceMq.Amqp.IIdempotencyStore.ClaimAsync(System.String)" data-throw-if-not-resolved="false"></xref> takes the message and returns

    false if somebody already has it; <xref href="AceMq.Amqp.IIdempotencyStore.ConfirmAsync(System.String)" data-throw-if-not-resolved="false"></xref> records that it

    finished; <xref href="AceMq.Amqp.IIdempotencyStore.ReleaseAsync(System.String)" data-throw-if-not-resolved="false"></xref> gives the claim back when it did not, so a

    retry is not mistaken for a duplicate. A store with only "seen" and "not seen"

    cannot tell a message that failed from one that succeeded, and will drop the

    retry of a message that never completed.

    </p>
