- api3: WithoutPublisherConfirms()
  id: AceMq_Amqp_ConnectionConfig_Builder_WithoutPublisherConfirms
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/ConnectionConfig.cs#L178
  metadata:
    uid: AceMq.Amqp.ConnectionConfig.Builder.WithoutPublisherConfirms
    commentId: M:AceMq.Amqp.ConnectionConfig.Builder.WithoutPublisherConfirms
- markdown: Turns publisher confirms off.
- code: public ConnectionConfig.Builder WithoutPublisherConfirms()
- h4: Returns
- parameters:
  - type:
    - text: ConnectionConfig
      url: AceMq.Amqp.ConnectionConfig.html
    - .
    - text: Builder
      url: AceMq.Amqp.ConnectionConfig.Builder.html
- h4: Remarks
- markdown: >-
    Without confirms a publish reports success as soon as the bytes are

    written, which is not the same as the broker having accepted them. It is

    faster and it loses messages on a broker restart. Left on by default for

    that reason.
