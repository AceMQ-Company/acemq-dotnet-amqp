- api3: WithRetry(RetryPolicy)
  id: AceMq_Amqp_ConsumerOptions_WithRetry_AceMq_Amqp_RetryPolicy_
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Consuming.cs#L207
  metadata:
    uid: AceMq.Amqp.ConsumerOptions.WithRetry(AceMq.Amqp.RetryPolicy)
    commentId: M:AceMq.Amqp.ConsumerOptions.WithRetry(AceMq.Amqp.RetryPolicy)
- markdown: Backs off between attempts and gives up according to a policy.
- code: public ConsumerOptions WithRetry(RetryPolicy policy)
- h4: Parameters
- parameters:
  - name: policy
    type:
    - text: RetryPolicy
      url: AceMq.Amqp.RetryPolicy.html
- h4: Returns
- parameters:
  - type:
    - text: ConsumerOptions
      url: AceMq.Amqp.ConsumerOptions.html
- h4: Remarks
- markdown: >-
    Without one, a handler that throws is retried after a fixed delay forever. A

    policy is what turns that into a bounded number of attempts with growing gaps,

    after which the message is dead-lettered rather than retried into eternity.
