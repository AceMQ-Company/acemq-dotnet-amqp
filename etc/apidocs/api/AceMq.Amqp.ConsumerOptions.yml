- markdown: Skips a message this store says has already been handled.
- code: public ConsumerOptions Idempotent(IIdempotencyStore store)
- h4: Parameters
- parameters:
  - name: store
    type:
    - text: IIdempotencyStore
      url: AceMq.Amqp.IIdempotencyStore.html
- h4: Returns
- parameters:
  - type:
    - text: ConsumerOptions
      url: AceMq.Amqp.ConsumerOptions.html
- h4: Remarks
- markdown: >-
    Every broker delivers at least once, so a consumer will see the same message

    twice eventually. This is what makes that safe when handling it twice is not.
- api3: Prefetch(int)
  id: AceMq_Amqp_ConsumerOptions_Prefetch_System_Int32_
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Consuming.cs#L186
  metadata:
    uid: AceMq.Amqp.ConsumerOptions.Prefetch(System.Int32)
    commentId: M:AceMq.Amqp.ConsumerOptions.Prefetch(System.Int32)
- markdown: >-
    How many unacknowledged messages the broker may have outstanding with this

    consumer.
- code: public static ConsumerOptions Prefetch(int prefetch)
- h4: Parameters
- parameters:
  - name: prefetch
    type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32
- h4: Returns
- parameters:
  - type:
    - text: ConsumerOptions
      url: AceMq.Amqp.ConsumerOptions.html
- h4: Remarks
- markdown: >-
    The default of 20 is deliberately modest. An unbounded prefetch hands a

    single consumer the whole queue, which turns a rolling deploy into a stall

    while one instance works through everything it was given.
- api3: RequeueingOnFailure()
  id: AceMq_Amqp_ConsumerOptions_RequeueingOnFailure
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Consuming.cs#L227
  metadata:
    uid: AceMq.Amqp.ConsumerOptions.RequeueingOnFailure
    commentId: M:AceMq.Amqp.ConsumerOptions.RequeueingOnFailure
- markdown: Returns a failed message to the queue rather than dead-lettering it.
- code: public ConsumerOptions RequeueingOnFailure()
- h4: Returns
- parameters:
  - type:
    - text: ConsumerOptions
      url: AceMq.Amqp.ConsumerOptions.html
- h4: Remarks
- markdown: >-
    Off by default, because requeueing a message that fails deterministically

    produces a hot loop that looks like throughput.
