    commentId: M:AceMq.Amqp.Topology.Builder.QueueWithDeadLetter(System.String)
- markdown: >-
    Declares a queue together with the dead-letter exchange and queue that

    receive what it gives up on.
- code: public Topology.Builder QueueWithDeadLetter(string name)
- h4: Parameters
- parameters:
  - name: name
    type:
    - text: string
      url: https://learn.microsoft.com/dotnet/api/system.string
- h4: Returns
- parameters:
  - type:
    - text: Topology
      url: AceMq.Amqp.Topology.html
    - .
    - text: Builder
      url: AceMq.Amqp.Topology.Builder.html
- h4: Remarks
- markdown: >-
    Three declarations and a binding, as one call, because they are only

    correct together. A queue whose <code>x-dead-letter-exchange</code> points at an

    exchange nobody declared, or at one with no queue bound to it, throws

    messages away exactly as if dead-lettering had never been configured — and

    nothing reports it. The dead-letter queue is named after the queue it

    serves, so the pairing is visible in the broker's UI.
