- api3: QueueWithDeadLetter(string)
  id: AceMq_Amqp_Topology_Builder_QueueWithDeadLetter_System_String_
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Topology.cs#L153
