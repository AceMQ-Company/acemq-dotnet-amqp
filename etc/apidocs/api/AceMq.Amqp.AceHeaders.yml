- h2: Remarks
- markdown: >-
    <p>

    Transliterated from <code>org.acemq.amqp.api.AceHeaders</code> and pinned by fixtures

    generated from the Java implementation rather than copied from its documentation.

    A port that hand-copies a wire contract acquires a difference nobody notices until

    two languages disagree in production, which is the failure this whole arrangement

    exists to prevent.

    </p>

    <p>

    <strong><xref href="AceMq.Amqp.AceHeaders.Prefix" data-throw-if-not-resolved="false"></xref> is reserved.</strong> A header carrying it is the

    engine's: it is materialised onto the <xref href="AceMq.Amqp.Envelope" data-throw-if-not-resolved="false"></xref> if this version knows

    it, and dropped from the application's headers either way. Use your own namespace

    — <code>x-yourcompany-</code> — for anything that must survive the round trip.

    </p>
