- markdown: TLS with no verification at all. <strong>Development only.</strong>
- code: public static TlsOptions Insecure()
- h4: Returns
- parameters:
  - type:
    - text: TlsOptions
      url: AceMq.Amqp.TlsOptions.html
- h4: Remarks
- markdown: >-
    Encrypted but unauthenticated: anything that can intercept the connection can

    present its own certificate, and will be handed the credentials used to

    authenticate. Reach for <xref href="AceMq.Amqp.TlsOptions.TrustCertificateAuthority(System.Security.Cryptography.X509Certificates.X509Certificate2)" data-throw-if-not-resolved="false"></xref> before this —

    a private CA is almost always the actual problem, and trusting it keeps

    verification switched on.
