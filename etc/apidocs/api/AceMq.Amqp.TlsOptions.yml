- api3: WithoutRevocationChecking()
  id: AceMq_Amqp_TlsOptions_WithoutRevocationChecking
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Security.cs#L313
  metadata:
    uid: AceMq.Amqp.TlsOptions.WithoutRevocationChecking
    commentId: M:AceMq.Amqp.TlsOptions.WithoutRevocationChecking
- markdown: Turns revocation checking off.
- code: public TlsOptions WithoutRevocationChecking()
- h4: Returns
- parameters:
  - type:
    - text: TlsOptions
      url: AceMq.Amqp.TlsOptions.html
- h4: Remarks
- markdown: >-
    A deliberate weakening: a certificate that has been revoked because its key

    leaked will still be accepted. The case that justifies it is an isolated

    network with no route to the issuer's responder, where the check does not fail

    closed so much as hang.
