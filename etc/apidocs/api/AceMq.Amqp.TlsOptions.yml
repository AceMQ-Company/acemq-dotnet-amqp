- api3: TrustCertificateAuthority(X509Certificate2)
  id: AceMq_Amqp_TlsOptions_TrustCertificateAuthority_System_Security_Cryptography_X509Certificates_X509Certificate2_
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Security.cs#L237
  metadata:
    uid: AceMq.Amqp.TlsOptions.TrustCertificateAuthority(System.Security.Cryptography.X509Certificates.X509Certificate2)
    commentId: M:AceMq.Amqp.TlsOptions.TrustCertificateAuthority(System.Security.Cryptography.X509Certificates.X509Certificate2)
- markdown: Trusts a private certificate authority, keeping verification on.
- code: public TlsOptions TrustCertificateAuthority(X509Certificate2 authority)
- h4: Parameters
- parameters:
  - name: authority
    type:
    - text: X509Certificate2
      url: https://learn.microsoft.com/dotnet/api/system.security.cryptography.x509certificates.x509certificate2
- h4: Returns
- parameters:
  - type:
    - text: TlsOptions
      url: AceMq.Amqp.TlsOptions.html
- h4: Remarks
- markdown: >-
    <p>

    This is what to use when the broker has an internally issued certificate. The

    chain is rebuilt against this authority and the hostname is still checked, so

    a broker presenting somebody else's certificate is still rejected.

    </p>

    <p>

    It is deliberately not the same as turning validation off, which is what most

    people do at this point. <xref href="AceMq.Amqp.TlsMode.Insecure" data-throw-if-not-resolved="false"></xref> accepts any

    certificate at all; this accepts exactly the ones your authority issued.

    </p>
