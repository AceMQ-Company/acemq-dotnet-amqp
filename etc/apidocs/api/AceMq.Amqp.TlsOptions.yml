- api3: Insecure()
  id: AceMq_Amqp_TlsOptions_Insecure
  src: https://github.com/AceMQ-Company/acemq-dotnet-amqp/blob/main/src/AceMq.Amqp/Security.cs#L206
  metadata:
    uid: AceMq.Amqp.TlsOptions.Insecure
