- h2: Remarks
- markdown: >-
    The definition is opaque here: JSON Schema, an Avro schema, a <code>.proto</code> — the

    registry stores and hands back text and does not interpret it. What it provides

    is the identity: the same schema always gets the same id, and a changed schema

    gets a different one.
