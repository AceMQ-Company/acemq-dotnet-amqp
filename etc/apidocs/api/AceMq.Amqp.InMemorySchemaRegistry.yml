- h2: Remarks
- markdown: >-
    <strong>Per process.</strong> Ids are handed out in the order schemas are

    registered, so two processes will disagree about which schema an id refers to,

    and a restart re-numbers everything. That makes it useful for tests and for a

    single process reading its own messages, and wrong for anything where a message

    outlives the process that wrote it. Use a shared registry for that — implement

    <xref href="AceMq.Amqp.ISchemaRegistry" data-throw-if-not-resolved="false"></xref> against your database or a Confluent-compatible

    registry.
