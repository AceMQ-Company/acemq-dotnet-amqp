- markdown: What an ordered queue does when a message fails.
- code: public enum PartitionFailure
- h2: Fields
- parameters:
  - name: RetryInPlace
    default: "1"
    description: >+
      Keep retrying the same message, holding everything behind it.

  - name: Skip
    default: "2"
    description: >+
      Dead-letter it and carry on with the next message.

  - name: Stop
    default: "0"
    description: >+
      Stop that partition. Nothing after the failed message is delivered until

      somebody intervenes.

