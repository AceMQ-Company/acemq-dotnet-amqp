- markdown: Maps schemas to short ids and back.
- code: public interface ISchemaRegistry
- h2: Remarks
- markdown: >-
    The point is that a message carries an id rather than a schema. A schema is

    kilobytes and every message would pay for it; the id is a few bytes and the

    consumer resolves it once.
